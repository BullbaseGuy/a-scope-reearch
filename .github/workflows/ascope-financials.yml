name: A-SCOPE Financial Request Manifest

on:
  workflow_run:
    workflows:
      - A-SCOPE Live Smoke
      - A-SCOPE Weekly Reconciliation
    types: [completed]
  workflow_dispatch:
    inputs:
      discovery_artifact_run_id:
        description: Optional run ID containing a validated security_master artifact
        required: false
        default: ''
      through:
        description: Financial data through date; blank uses discovery as_of_date
        required: false
        default: ''

permissions:
  actions: read
  contents: read

jobs:
  manifest:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ascope
      - name: Resolve source workflow run
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_RUN_ID: ${{ inputs.discovery_artifact_run_id }}
          AUTOMATIC_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            RUN_ID="$MANUAL_RUN_ID"
          else
            RUN_ID="$AUTOMATIC_RUN_ID"
          fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: incoming
      - name: Validate discovery and create financial batches
        env:
          INPUT_THROUGH: ${{ inputs.through }}
        run: |
          set -euo pipefail
          MASTER="$(find incoming -name security_master.csv -type f | head -n1)"
          DISCOVERY="$(find incoming -name discovery_manifest.json -type f | head -n1)"
          test -n "$MASTER"
          test -n "$DISCOVERY"
          THROUGH="$INPUT_THROUGH"
          if [[ -z "$THROUGH" ]]; then
            THROUGH="$(python - "$DISCOVERY" <<'PY'
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          if value.get('validation', {}).get('status') != 'PASS':
              raise SystemExit('discovery validation is not PASS')
          print(value['as_of_date'])
          PY
          )"
          fi
          python -m ascope financial-manifest \
            --security-master "$MASTER" \
            --output-dir 09_OUTPUTS/financial-requests \
            --through "$THROUGH" \
            --batch-size 200
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ascope-financial-requests-${{ github.run_id }}
          path: 09_OUTPUTS/financial-requests
          retention-days: 30
