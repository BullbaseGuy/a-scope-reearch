name: Kick Bootstrap

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  kick:
    if: github.head_ref == 'feature/devflow-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/devflow-bootstrap
          fetch-depth: 0
          persist-credentials: true
      - name: Touch the bootstrap workflow exactly once
        run: |
          set -euo pipefail
          TARGET=.github/workflows/bootstrap-devflow.yml
          if grep -Fq '# bootstrap-triggered' "$TARGET"; then
            echo 'Bootstrap workflow has already been triggered.'
            exit 0
          fi
          printf '\n# bootstrap-triggered\n' >> "$TARGET"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$TARGET"
          git commit -m "chore: trigger devflow materialization"
          git push origin HEAD:feature/devflow-bootstrap
