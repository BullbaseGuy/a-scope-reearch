name: A-SCOPE Weekly Reconciliation
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 6"
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ascope
      - run: python -m ascope discover --output-dir 09_OUTPUTS/weekly --as-of-date "$(date -u +%F)" --minimum-count 5000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ascope-weekly-${{ github.run_id }}
          path: 09_OUTPUTS/weekly
          retention-days: 30
