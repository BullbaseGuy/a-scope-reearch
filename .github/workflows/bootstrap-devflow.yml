name: Bootstrap Devflow

on:
  push:
    branches:
      - feature/devflow-bootstrap
    paths:
      - .github/workflows/bootstrap-devflow.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/devflow-bootstrap
          fetch-depth: 0
          persist-credentials: true

      - name: Import non-workflow scaffold files
        shell: bash
        env:
          SCAFFOLD_SHA: ff6619b1f0ef6797ad1ca09fffa5db9475dc2482
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout \
            https://github.com/BullbaseGuy/demo-project.git /tmp/demo-project
          git -C /tmp/demo-project checkout "$SCAFFOLD_SHA"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github/workflows' \
            --exclude='.github/workflows/**' \
            /tmp/demo-project/ ./

      - name: Adapt scaffold for A-SCOPE
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          (root / 'README.md').write_text('''# A-SCOPE\n\nA-SCOPE is a full-market A-share candidate discovery and evidence-upgrade system for a satellite investment account.\n\nThe repository reuses the reviewed `BullbaseGuy/demo-project` control plane. Canonical task state lives under `docs/implementation/`; GitHub Actions performs deterministic gates; model/agent execution and automatic merge remain disabled.\n\n## Start here\n\n- [`docs/USAGE.md`](docs/USAGE.md)\n- [`docs/process/README.md`](docs/process/README.md)\n- [`docs/implementation/ACTIVE_TASKS.yaml`](docs/implementation/ACTIVE_TASKS.yaml)\n\nProduct implementation begins in a separate governed task after this bootstrap PR is merged.\n''', encoding='utf-8')

          pyproject_path = root / 'pyproject.toml'
          pyproject = pyproject_path.read_text(encoding='utf-8')
          pyproject = pyproject.replace('name = "generic-devflow-scaffold"', 'name = "a-scope-reearch"')
          pyproject = pyproject.replace(
              'description = "Repository-neutral ChatGPT Web and GitHub Actions execution scaffold"',
              'description = "A-SCOPE full-market A-share candidate discovery system"',
          )
          pyproject = pyproject.replace('requires-python = ">=3.11"', 'requires-python = ">=3.12"')
          pyproject = pyproject.replace('target-version = "py311"', 'target-version = "py312"')
          pyproject_path.write_text(pyproject, encoding='utf-8')

          project_path = root / '.devflow/project.json'
          project = json.loads(project_path.read_text(encoding='utf-8'))
          project['project'].update({
              'default_branch': 'main',
              'allowed_actors': ['tyxq428'],
              'notification_mentions': ['tyxq428'],
              'python_version': '3.12',
          })
          project['features'].update({
              'automatic_merge': False,
              'agent_execution': 'disabled',
              'relay_paid_probe': False,
              'branch_gc_execute': False,
          })
          project_path.write_text(json.dumps(project, indent=2) + '\n', encoding='utf-8')

          task_id = 'devflow-bootstrap'
          task_dir = root / 'docs/implementation' / task_id
          task_dir.mkdir(parents=True, exist_ok=True)
          active = {
              'schema_version': 2,
              'tasks': [{
                  'task_id': task_id,
                  'branch': 'feature/devflow-bootstrap',
                  'task_branch': None,
                  'publish_branch': None,
                  'pull_request': 2,
                  'state_path': f'docs/implementation/{task_id}/task_state.yaml',
                  'post_merge_profile': 'post-merge',
                  'status': 'VERIFYING',
              }],
          }
          (root / 'docs/implementation/ACTIVE_TASKS.yaml').write_text(
              json.dumps(active, indent=2) + '\n', encoding='utf-8'
          )
          state = {
              'schema_version': 2,
              'task_id': task_id,
              'status': 'VERIFYING',
              'execution_status': 'COMPLETED',
              'branch': 'feature/devflow-bootstrap',
              'task_branch': None,
              'publish_branch': None,
              'pull_request': 2,
              'expected_base_sha': 'ca8032c5d232dad7ee1293c0872c7b5d1e26246c',
              'current_work_package': 'W02',
              'completed_work_packages': ['W00', 'W01'],
              'post_merge_profile': 'post-merge',
              'risk_class': 'medium',
              'auto_merge': False,
              'acceptance': {'domain': 'repository-bootstrap', 'status': 'PASS'},
              'security_status': 'PASS',
              'post_merge': {'status': 'PENDING', 'merge_sha': None},
              'human_gate': {'required': False, 'reason': None},
              'notification': {'control_issue_number': 1, 'notify_completion': True},
              'next_action': 'Install reviewed workflow files through the GitHub connector, then run PR checks.',
              'updated_at_utc': '2026-07-30T03:08:00Z',
          }
          (task_dir / 'task_state.yaml').write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')

          docs = {
              '00_contract.md': '# Contract: devflow-bootstrap\n\nInstall the reviewed deterministic control plane before product implementation. Agent/model execution and automatic merge are out of scope and disabled.\n',
              '01_master_plan.md': '# Master plan\n\nW00 freeze scope; W01 import scaffold; W02 run PR checks; W03 merge and close out.\n',
              'STATUS.md': '# Status\n\nVERIFYING; execution, acceptance and security passed; post-merge pending.\n',
              'HANDOFF.md': '# Handoff\n\nNon-workflow scaffold files are imported. Install reviewed workflows through the connector, then inspect PR checks.\n',
              'DECISIONS.md': '# Decisions\n\n- Reuse demo-project at fixed commit.\n- Separate bootstrap and product PRs.\n- Keep agent calls and automatic merge disabled.\n',
              'W00_plan.md': '# W00 plan\n\nFreeze scope and safety defaults.\n',
              'W00_result.md': '# W00 result\n\nPASS.\n',
              'W01_plan.md': '# W01 plan\n\nImport and adapt the reviewed scaffold.\n',
              'W01_result.md': '# W01 result\n\nPASS for non-workflow files; workflows are installed separately because GitHub Actions tokens cannot modify workflow files.\n',
          }
          for name, content in docs.items():
              (task_dir / name).write_text(content, encoding='utf-8')
          manual = {
              'schema_version': 1,
              'actions': [
                  {
                      'id': 'MA-001', 'stage': 'post-bootstrap', 'blocking': False,
                      'owner': 'repository-admin',
                      'reason': 'Configure main required checks after stable check names appear.',
                      'minimum_action': 'Require Test, State Consistency and Upgrade Compatibility.',
                      'workaround': 'Use reviewed manual merges until configured.',
                      'status': 'OPEN', 'resume_point': 'No pause required.'
                  }
              ]
          }
          (task_dir / 'MANUAL_ACTIONS.yaml').write_text(json.dumps(manual, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate imported non-workflow control plane
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m compileall -q scripts tests
          python scripts/devflow/validate_docs.py
          python scripts/devflow/validate_state.py --all-active --no-git
          ruff check scripts tests
          pytest -q tests

      - name: Commit and push non-workflow scaffold
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- ':!.github/workflows'
          git diff --cached --quiet && exit 0
          git commit -m "chore: import reviewed devflow scaffold"
          git push origin HEAD:feature/devflow-bootstrap
