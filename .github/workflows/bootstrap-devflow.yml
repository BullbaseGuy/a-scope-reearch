name: Bootstrap Devflow

on:
  push:
    branches:
      - feature/devflow-bootstrap
    paths:
      - .github/workflows/bootstrap-devflow.yml
  pull_request:
    types: [synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/bootstrap-devflow.yml

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event_name == 'push' || github.head_ref == 'feature/devflow-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/devflow-bootstrap
          fetch-depth: 0
          persist-credentials: true

      - name: Import reviewed non-workflow scaffold files
        shell: bash
        env:
          SCAFFOLD_SHA: ff6619b1f0ef6797ad1ca09fffa5db9475dc2482
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout \
            https://github.com/BullbaseGuy/demo-project.git /tmp/demo-project
          git -C /tmp/demo-project checkout "$SCAFFOLD_SHA"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github/workflows' \
            --exclude='.github/workflows/**' \
            --exclude='.bootstrap' \
            --exclude='.bootstrap/**' \
            /tmp/demo-project/ ./

      - name: Adapt scaffold for A-SCOPE
        run: python .bootstrap/materialize.py

      - name: Validate imported non-workflow control plane
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m compileall -q scripts tests
          rm -rf .bootstrap/__pycache__
          python scripts/devflow/validate_docs.py
          python scripts/devflow/validate_state.py --all-active --no-git
          ruff check scripts tests .bootstrap
          pytest -q tests

      - name: Commit and push non-workflow scaffold
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- ':!.github/workflows'
          git diff --cached --quiet && exit 0
          git commit -m "chore: import reviewed devflow scaffold"
          git push origin HEAD:feature/devflow-bootstrap
