name: Devflow Secret Audit

on:
  push:
    paths:
      - '.github/**'
      - '.devflow/**'
      - 'config/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/**'
      - '.devflow/**'
      - 'config/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with:
          python-version: '3.12'
      - name: Run bounded secret audit
        run: python scripts/devflow/secret_audit.py --output secret-audit.json
      - name: Upload safe audit summary on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secret-audit-${{ github.run_id }}
          path: secret-audit.json
          if-no-files-found: warn
          retention-days: 7
