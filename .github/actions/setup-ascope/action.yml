name: Setup A-SCOPE
description: Install the pinned Python runtime and repository dependencies
runs:
  using: composite
  steps:
    - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml
    - shell: bash
      run: python -m pip install -e ".[dev]"
